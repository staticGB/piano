<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Piano & Retro Sampler</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.min.js"></script>
    <style>
        /* --- Key Styling --- */
        #keyboard-container {
            display: flex;
            position: relative;
            user-select: none;
            -webkit-user-select: none;
            padding: 1rem;
            max-width: 98%; 
            margin: auto;
            overflow-x: auto;
            min-width: max-content; /* Ensures keys don't squash */
        }

        .white-key {
            width: 60px; /* Slightly narrower to fit more keys */
            height: 250px;
            border: 1px solid #1f2937;
            border-radius: 0 0 8px 8px;
            box-shadow: 0 5px 0 #9ca3af;
            transition: all 0.05s ease;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 0.5rem; /* Adjusted padding to fit two labels */
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            font-weight: 500;
            background: linear-gradient(to bottom, #ffffff 0%, #f3f4f6 100%);
            position: relative;
            z-index: 1;
        }
        
        .white-key.active {
            /* BLUE GLOW ACTIVE STATE */
            box-shadow: 0 2px 0 #9ca3af, 0 0 15px rgba(59, 130, 246, 0.7); /* Blue glow */
            transform: translateY(3px);
            /* Subtle blue gradient on press */
            background: linear-gradient(to bottom, #dbeafe 0%, #bfdbfe 100%); 
        }

        .black-key {
            width: 36px; /* Proportional adjustment */
            height: 150px;
            background: linear-gradient(to bottom, #374151 0%, #111827 100%);
            position: absolute;
            z-index: 10;
            border-radius: 0 0 6px 6px;
            box-shadow: 0 4px 0 #000000;
            transition: all 0.05s ease;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 0.3rem; /* Adjusted padding to fit two labels */
            color: #d1d5db;
            font-family: 'Inter', sans-serif;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .black-key.active {
            /* BLUE GLOW ACTIVE STATE */
            box-shadow: 0 1px 0 #000000, 0 0 15px rgba(37, 99, 235, 0.8); /* Dark blue glow */
            transform: translateY(3px);
            /* Darker blue on press */
            background: linear-gradient(to bottom, #1e3a8a 0%, #172554 100%); 
        }
        
        /* Key Labels Container */
        .note-label-group {
            pointer-events: none;
            /* Flex column is set in JS generated HTML */
        }
        
        /* Note Name Specific Style */
        .note-name {
            opacity: 0.9;
            margin-bottom: 0.1rem;
        }

        /* Keyboard Key Label Specific Style */
        .key-label {
            opacity: 0.7;
            font-size: 0.75rem;
        }

        @media (max-width: 768px) {
            .white-key { width: 35px; height: 150px; padding-bottom: 0.5rem; font-size: 0.5rem; }
            .black-key { width: 22px; height: 90px; padding-bottom: 0.3rem; font-size: 0.4rem; }
            .note-name { font-size: 0.6rem; }
            .key-label { font-size: 0.4rem; }
            #keyboard-container { padding: 0.5rem; }
        }

        #keyboard-wrapper {
            /* Now just a deep black panel */
            background: #000000; /* Pure black base */
            border: none;
            border-radius: 0 0 12px 12px;
            box-shadow: 
                inset 0 1px 0px rgba(255, 255, 255, 0.05), /* Very subtle top highlight */
                inset 0 2px 5px rgba(0, 0, 0, 0.5), /* Inner depth */
                inset 0 -1px 0 rgba(0, 0, 0, 0.9), /* Dark inner bottom line */
                0 10px 30px rgba(0, 0, 0, 0.8), /* Stronger outer shadow for lift */
                0 0 0 5px rgba(0, 0, 0, 0.2); /* Outer border glow */
            position: relative;
        }

        /* Removed #keyboard-wrapper::before (glare) */
        
        /* --- Sampler UI Specifics --- */
        .led-light {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #4b5563;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);
            transition: background-color 0.2s;
        }
        .led-light.on {
            background-color: #ef4444;
            box-shadow: 0 0 10px #ef4444, inset 0 1px 2px rgba(0,0,0,0.2);
        }
        .sampler-btn.active {
            background-color: #4f46e5; /* Indigo 600 */
            color: white;
            border-color: #4338ca;
        }
        .opacity-30 {
            cursor: default;
        }
    </style>
</head>

<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-4">

    <header class="text-center mb-4 max-w-lg">
        <h1 class="text-3xl font-extrabold text-gray-800 mb-1 font-inter">SK-1 Style Sampler</h1>
        <p class="text-sm text-gray-600">Mode 1: Grand Piano | Mode 2: Record mic or Upload MP3</p>
    </header>

    <!-- Controls Area --><div class="w-full max-w-6xl bg-gray-800 rounded-t-xl p-4 shadow-lg text-white flex flex-wrap items-center justify-between gap-4 border-b-4 border-gray-900">
        
        <!-- Control Group: Start, Display, Octave --><div class="flex items-center gap-4">
            <button id="start-audio" class="px-4 py-2 bg-gray-600 hover:bg-gray-500 text-white text-sm font-bold rounded shadow transition">
                Initialize Audio
            </button>
            
            <div id="chord-display" class="px-3 py-1 bg-indigo-900 border border-indigo-500 rounded text-sm font-mono tracking-wider shadow-inner w-48 truncate">
                Playing: None
            </div>

            <!-- OCTAVE SHIFTER (Made more compact) --><div class="flex items-center gap-2 text-xs font-semibold">
                <button id="octave-down" class="px-2 py-1 rounded text-gray-400 hover:bg-gray-700 transition active:scale-95 text-sm">
                    -
                </button>
                <div id="octave-display" class="px-2 py-1 bg-gray-700 rounded w-10 text-center text-yellow-400 border border-gray-600 shadow-inner">
                    0
                </div>
                <button id="octave-up" class="px-2 py-1 rounded text-gray-400 hover:bg-gray-700 transition active:scale-95 text-sm">
                    +
                </button>
            </div>
            <!-- END OCTAVE SHIFTER --></div>

        <!-- Instrument Selector (FIXED: Changed flex-col to flex-row and added gap) --><div class="flex flex-row gap-1 bg-gray-900 rounded-lg p-1"> 
            <button id="btn-piano" class="sampler-btn active px-4 py-1.5 rounded text-sm font-medium text-gray-300 hover:text-white transition" onclick="setInstrument('piano')">
                Grand Piano
            </button>
            <button id="btn-sampler" class="sampler-btn px-4 py-1.5 rounded text-sm font-medium text-gray-300 hover:text-white transition" onclick="setInstrument('sampler')">
                Custom Sampler
            </button>
        </div>

        <!-- Sampler Controls (Hidden by default logic handles visuals) --><div id="sampler-controls" class="flex items-center gap-3 opacity-50 pointer-events-none transition-opacity duration-300">
            <!-- Recording Section --><div class="flex items-center gap-2">
                <div class="flex flex-col items-center">
                    <div id="recording-led" class="led-light mb-1"></div>
                    <span class="text-[8px] uppercase tracking-wider text-gray-400">Rec</span>
                </div>
                
                <button id="record-btn" class="bg-red-600 hover:bg-red-500 active:bg-red-700 text-white text-xs font-bold py-2 px-4 rounded-full shadow-lg transition transform active:scale-95 select-none border-2 border-red-800 whitespace-nowrap">
                    HOLD TO RECORD
                </button>
            </div>

            <!-- Divider --><div class="h-8 w-px bg-gray-600 mx-1"></div>

            <!-- Upload Section --><div class="flex items-center">
                <input type="file" id="file-upload" accept="audio/*" style="display:none;">
                <button id="upload-btn" class="bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white text-xs font-bold py-2 px-4 rounded-lg shadow-lg transition transform active:scale-95 border-2 border-blue-800 whitespace-nowrap">
                    UPLOAD SOUND
                </button>
            </div>
        </div>
    </div>

    <!-- Piano Keyboard Container --><div id="keyboard-wrapper" class="w-full max-w-6xl p-6 rounded-b-xl shadow-2xl overflow-x-auto relative">
        <div id="keyboard-container">
            <!-- Keys generated via JS --></div>
    </div>
    
    <div id="message-box" class="mt-4 p-3 bg-yellow-100 border border-yellow-300 text-yellow-800 rounded-lg hidden text-sm text-center">
        Audio suspended. Click 'Initialize Audio' to start.
    </div>

    <script>
        // --- Firebase / App Config ---
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        
        // --- Global State ---
        let currentInstrument = 'piano'; // 'piano' or 'sampler'
        let pianoSynth;      
        let samplerSynth;    
        let mic;             
        let recorder;        
        let isRecording = false;
        let arePianoSamplesLoaded = false;

        // --- Octave Shift and Key Tracking State ---
        let octaveShift = 0; 
        // Maps {originalNote: soundingNote} to ensure correct note release even if shift changes while key is held
        let activePhysicalKeys = new Map(); 
        // Set of currently sounding notes for chord detection
        let notesCurrentlySounding = new Set(); 
        
        // --- Note/Key Mapping (UPDATED) ---
        const keysMap = {
            // C2 - F3 (White Keys on QWERTY Top Row)
            'q': { note: 'C2' }, 'w': { note: 'D2' }, 'e': { note: 'E2' }, 'r': { note: 'F2' }, 
            't': { note: 'G2' }, 'y': { note: 'A2' }, 'u': { note: 'B2' }, 'i': { note: 'C3' }, 
            'o': { note: 'D3' }, 'p': { note: 'E3' }, '[': { note: 'F3' },
            ']': { note: 'G3' }, 
            '\\': { note: 'A3' }, 

            // Black Keys for C2-F3 (Numbers + Dash/Equals)
            '2': { note: 'C#2' }, '3': { note: 'D#2' }, 
            '5': { note: 'F#2' }, '6': { note: 'G#2' }, '7': { note: 'A#2' },
            '9': { note: 'C#3' }, 
            '0': { note: 'D#3' }, // MAPPED D#3 to '0'
            '=': { note: 'F#3' }, 

            // G3 - B4 (White Keys on QWERTY Bottom Row)
            'z': { note: 'G3' }, 'x': { note: 'A3' }, 'c': { note: 'B3' }, 
            'v': { note: 'C4' }, 'b': { note: 'D4' }, 'n': { note: 'E4' }, 
            'm': { note: 'F4' }, ',': { note: 'G4' }, '.': { note: 'A4' }, '/': { note: 'B4' },

            // Black Keys for G3-B4 (Home Row & Sharps, shifted right)
            's': { note: 'G#3' }, 'd': { note: 'A#3' }, 
            'g': { note: 'C#4' }, 'h': { note: 'D#4' }, 
            'k': { note: 'F#4' }, 'l': { note: 'G#4' }, ';': { note: 'A#4' },
        };
        
        // Key Sequence for Visual Piano Construction (UPDATED)
        const keySequence = [
            // --- C2 Octave ---
            { note: 'C2', type: 'white', keyboardKey: 'Q' }, { note: 'C#2', type: 'black', keyboardKey: '2' },
            { note: 'D2', type: 'white', keyboardKey: 'W' }, { note: 'D#2', type: 'black', keyboardKey: '3' },
            { note: 'E2', type: 'white', keyboardKey: 'E' }, 
            { note: 'F2', type: 'white', keyboardKey: 'R' }, { note: 'F#2', type: 'black', keyboardKey: '5' },
            { note: 'G2', type: 'white', keyboardKey: 'T' }, { note: 'G#2', type: 'black', keyboardKey: '6' },
            { note: 'A2', type: 'white', keyboardKey: 'Y' }, { note: 'A#2', type: 'black', keyboardKey: '7' },
            { note: 'B2', type: 'white', keyboardKey: 'U' },

            // --- C3 Octave ---
            { note: 'C3', type: 'white', keyboardKey: 'I' }, { note: 'C#3', type: 'black', keyboardKey: '9' }, 
            { note: 'D3', type: 'white', keyboardKey: 'O' }, { note: 'D#3', type: 'black', keyboardKey: '0' }, // KEY changed from '-' to '0'
            { note: 'E3', type: 'white', keyboardKey: 'P' }, 
            { note: 'F3', type: 'white', keyboardKey: '[' },
            { note: 'F#3', type: 'black', keyboardKey: '=' }, 
            
            // --- G3 Octave (Starting Z-row) ---
            { note: 'G3', type: 'white', keyboardKey: 'Z' }, { note: 'G#3', type: 'black', keyboardKey: 'S' },
            { note: 'A3', type: 'white', keyboardKey: 'X' }, { note: 'A#3', type: 'black', keyboardKey: 'D' },
            { note: 'B3', type: 'white', keyboardKey: 'C' }, 
            { note: 'C4', type: 'white', keyboardKey: 'V' }, { note: 'C#4', type: 'black', keyboardKey: 'G' },
            { note: 'D4', type: 'white', keyboardKey: 'B' }, { note: 'D#4', type: 'black', keyboardKey: 'H' },
            { note: 'E4', type: 'white', keyboardKey: 'N' }, 
            { note: 'F4', type: 'white', keyboardKey: 'M' }, { note: 'F#4', type: 'black', keyboardKey: 'K' },
            { note: 'G4', type: 'white', keyboardKey: ',' }, { note: 'G#4', type: 'black', keyboardKey: 'L' },
            { note: 'A4', type: 'white', keyboardKey: '.' }, { note: 'A#4', type: 'black', keyboardKey: ';' },
            { note: 'B4', type: 'white', keyboardKey: '/' }, 
        ];

        // White key notes used for positioning black keys. Must match the sequence.
        const whiteKeyNotes = [
            'C2', 'D2', 'E2', 'F2', 'G2', 'A2', 'B2',
            'C3', 'D3', 'E3', 'F3', 
            'G3', 'A3', 'B3', 'C4', 'D4', 'E4', 'F4', 'G4', 'A4', 'B4'
        ];

        // --- Initialization and Tone.js setup remains the same ---
        async function initAudio() {
            await Tone.start();
            
            // 1. Setup Piano 
            pianoSynth = new Tone.Sampler({
                urls: { 
                    "C3": "C3.mp3", "D#3": "Ds3.mp3", "F#3": "Fs3.mp3", "A3": "A3.mp3",
                    "C4": "C4.mp3", "D#4": "Ds4.mp3", "F#4": "Fs4.mp3", "A4": "A4.mp3", 
                    "C5": "C5.mp3", "D#5": "Ds5.mp3", "F#5": "Fs5.mp3", "A5": "A5.mp3" 
                },
                release: 1,
                baseUrl: "https://tonejs.github.io/audio/salamander/",
                onload: () => {
                    arePianoSamplesLoaded = true;
                    updateStartButton();
                }
            }).toDestination();
            pianoSynth.volume.value = -5;

            // 2. Setup Recording Infrastructure
            mic = new Tone.UserMedia();
            recorder = new Tone.Recorder();
            mic.connect(recorder);

            // 3. Setup Default "Empty" Sampler
            samplerSynth = new Tone.PolySynth(Tone.Synth).toDestination();
            samplerSynth.volume.value = -8;

            updateStartButton();
            document.getElementById('message-box').classList.add('hidden');
        }

        function updateStartButton() {
            const btn = document.getElementById('start-audio');
            if (Tone.context.state === 'running') {
                btn.textContent = arePianoSamplesLoaded ? "Audio Ready" : "Loading Piano...";
                btn.classList.remove('bg-gray-600', 'bg-red-600');
                btn.classList.add('bg-green-600');
            }
        }

        // --- Instrument Switching Logic (Same) ---
        window.setInstrument = function(type) {
            currentInstrument = type;
            document.getElementById('btn-piano').classList.toggle('active', type === 'piano');
            document.getElementById('btn-sampler').classList.toggle('active', type === 'sampler');
            const controls = document.getElementById('sampler-controls');
            if (type === 'sampler') {
                controls.classList.remove('opacity-50', 'pointer-events-none');
            } else {
                controls.classList.add('opacity-50', 'pointer-events-none');
            }
        };

        // --- Sampler Helpers (Same) ---
        function createCustomSampler(url, sourceName) {
            const newSampler = new Tone.Sampler({
                urls: { C4: url },
                onload: () => {
                    if(sourceName === 'mic') {
                        document.getElementById('record-btn').textContent = "RECORDED!";
                        setTimeout(() => document.getElementById('record-btn').textContent = "HOLD TO RECORD", 1500);
                    } else {
                        document.getElementById('upload-btn').textContent = "LOADED!";
                        setTimeout(() => document.getElementById('upload-btn').textContent = "UPLOAD SOUND", 1500);
                    }
                }
            }).toDestination();

            if (samplerSynth) {
                samplerSynth.dispose();
            }
            samplerSynth = newSampler;
        }

        // --- Recording Logic (Same) ---
        const recordBtn = document.getElementById('record-btn');
        const led = document.getElementById('recording-led');

        async function startRecording() {
            if (Tone.context.state !== 'running') {
                try { await Tone.start(); initAudio(); } catch(e) {}
            }
            try {
                if (mic.state !== 'started') await mic.open();
                recorder.start();
                isRecording = true;
                led.classList.add('on');
                recordBtn.textContent = "RECORDING...";
                recordBtn.classList.add('animate-pulse');
            } catch (e) {
                console.error("Mic Error:", e);
                document.getElementById('message-box').classList.remove('hidden');
            }
        }

        async function stopRecording() {
            if (!isRecording) return;
            isRecording = false;
            led.classList.remove('on');
            recordBtn.textContent = "Processing...";
            recordBtn.classList.remove('animate-pulse');
            const recording = await recorder.stop();
            createCustomSampler(URL.createObjectURL(recording), 'mic');
        }

        recordBtn.addEventListener('mousedown', startRecording);
        window.addEventListener('mouseup', stopRecording); 
        recordBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startRecording(); });
        window.addEventListener('touchend', stopRecording);

        // --- File Upload Logic (Same) ---
        const uploadBtn = document.getElementById('upload-btn');
        const fileInput = document.getElementById('file-upload');
        uploadBtn.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (file) {
                if (Tone.context.state !== 'running') {
                    try { await Tone.start(); updateStartButton(); } catch(e) {}
                }
                uploadBtn.textContent = "Loading...";
                createCustomSampler(URL.createObjectURL(file), 'upload');
            }
            fileInput.value = '';
        });

        // --- Chord Detection Logic ---
        const noteMap = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
        const chordPatterns = {
            // Triads
            "Major": [0, 4, 7],
            "Minor": [0, 3, 7],
            "Diminished": [0, 3, 6],
            "Augmented": [0, 4, 8],
            "Sus2": [0, 2, 7],
            "Sus4": [0, 5, 7],
            // Sevenths
            "Maj7": [0, 4, 7, 11],
            "min7": [0, 3, 7, 10],
            "7": [0, 4, 7, 10], // Dominant 7th
            "dim7": [0, 3, 6, 9], // Fully Diminished 7th
            "halfDim7": [0, 3, 6, 10], // Half Diminished (m7b5)
            "minMaj7": [0, 3, 7, 11],
            "Aug7": [0, 4, 8, 10]
        };

        function getPitchClasses(notes) {
            // Convert Tone.js notes (C4, F#3, etc.) to pitch classes (0-11)
            // Use notesCurrentlySounding set here
            return Array.from(notes).map(note => Tone.Midi(note).toMidi() % 12).sort((a, b) => a - b);
        }

        function findChord(activeNotes) {
            if (activeNotes.size === 0) return "Playing: None";
            const numNotes = activeNotes.size;
            
            // If only one note is played, display the note name
            if (numNotes === 1) {
                const note = Array.from(activeNotes)[0];
                return `Single Note: ${note.slice(0, -1)}`; // Remove Octave
            }
            
            // Convert notes to sorted pitch classes
            let pitchClasses = getPitchClasses(activeNotes);
            
            // Root Note Detection (Iterate through all 12 potential roots)
            for (let i = 0; i < 12; i++) {
                // Check if the current note is in the pitch set
                if (!pitchClasses.includes(i)) continue;

                const rootName = noteMap[i];
                // Normalize the pitch classes relative to the assumed root (i)
                const normalizedPattern = pitchClasses
                    .map(pc => (pc - i + 12) % 12)
                    .sort((a, b) => a - b);
                
                // Remove duplicates after normalization (e.g., C4 and C5 are both 0)
                const uniqueNormalizedPattern = [...new Set(normalizedPattern)];

                // Check against known chord patterns
                for (const [chordName, intervals] of Object.entries(chordPatterns)) {
                    if (intervals.length === uniqueNormalizedPattern.length &&
                        intervals.every((interval, index) => interval === uniqueNormalizedPattern[index])) {
                        
                        return `${rootName} ${chordName}`;
                    }
                    // Special handling for power chords (e.g., C5)
                    if (numNotes === 2 && uniqueNormalizedPattern.includes(0) && uniqueNormalizedPattern.includes(7)) {
                        return `${rootName}5 (Power Chord)`;
                    }
                }
            }
            
            // Fallback for complex/unknown chords
            if (numNotes >= 4) return "Complex Harmony (4+ notes)";
            if (numNotes === 3) return "Unknown Triad (3 notes)";
            return `Multi Note (${numNotes} notes)`;
        }

        function updateChordDisplay() {
            // Now uses notesCurrentlySounding set
            const chordName = findChord(notesCurrentlySounding); 
            document.getElementById('chord-display').textContent = chordName;
        }

        // --- Octave Shifter Logic ---
        function updateOctaveDisplay() {
            const display = document.getElementById('octave-display');
            const downBtn = document.getElementById('octave-down');
            const upBtn = document.getElementById('octave-up');

            // Display format: 0, +1, +2, -1, -2
            display.textContent = octaveShift > 0 ? `+${octaveShift}` : octaveShift.toString();
            
            // Disable buttons at limits
            downBtn.disabled = octaveShift <= -2;
            upBtn.disabled = octaveShift >= 2;
            downBtn.classList.toggle('opacity-30', octaveShift <= -2);
            upBtn.classList.toggle('opacity-30', octaveShift >= 2);
        }

        function shiftOctave(direction) {
            // Stop all currently sounding notes before shifting to prevent hanging notes
            // Iterating over a copy to avoid issues with modification during iteration
            const currentlyPlayingNotes = new Set(notesCurrentlySounding);
            currentlyPlayingNotes.forEach(note => {
                // Find the original physical key that triggered this sounding note
                for (let [originalKey, soundingNote] of activePhysicalKeys.entries()) {
                    if (soundingNote === note) {
                        stopNote(originalKey); // This will clear both maps
                        break; 
                    }
                }
            });


            octaveShift += direction;
            // Clamp the shift to a reasonable range (-2 to +2 octaves)
            if (octaveShift < -2) octaveShift = -2;
            if (octaveShift > 2) octaveShift = 2;
            
            updateOctaveDisplay();
            updateKeyLabels(); // <--- NEW: Update all key labels after shift
        }

        function applyOctaveShift(note, shift) {
            // Tone.js notes are like "C4" or "A#3"
            const noteName = note.slice(0, -1);
            const octave = parseInt(note.slice(-1), 10);
            const newOctave = octave + shift;
            return `${noteName}${newOctave}`;
        }
        
        // --- Keyboard Logic ---
        const keyboardContainer = document.getElementById('keyboard-container');
        let whiteKeyCount = 0;
        const blackKeysToAppend = [];
        
        // Single loop to create elements and attach listeners
        keySequence.forEach(keyData => {
            const keyElement = document.createElement('div');
            // Use original note name for element ID for consistent visuals
            keyElement.id = `key-${keyData.note.replace('#', 's')}`; 
            
            keyElement.classList.add('transition-all', 'duration-50');
            
            // --- NEW: Store original note data attribute ---
            keyElement.setAttribute('data-original-note', keyData.note);

            // --- KEY LABEL GENERATION ---
            let keyboardKey = keyData.keyboardKey || '';
            let noteColor = keyData.type === 'black' ? 'text-blue-300' : 'text-gray-700';
            
            if (keyboardKey) {
                // Use a placeholder note for initial render; updateKeyLabels will populate it.
                keyElement.innerHTML = `
                    <div class="flex flex-col items-center note-label-group">
                        <span class="note-name text-xs font-bold ${noteColor}">--</span> 
                        <span class="key-label">${keyboardKey}</span>
                    </div>
                `;
            }
            // --- END KEY LABEL GENERATION ---

            // --- LISTENERS ADDED HERE (For both white and black keys) ---
            // Pass the original note name from the keysMap
            const startNote = (e) => { if(e.cancelable) e.preventDefault(); playNote(keyData.note); };
            const endNote = () => stopNote(keyData.note);

            keyElement.addEventListener('mousedown', startNote);
            keyElement.addEventListener('mouseup', endNote);
            keyElement.addEventListener('mouseleave', endNote);
            keyElement.addEventListener('touchstart', startNote);
            keyElement.addEventListener('touchend', endNote);
            // -----------------------------------------------------------

            if (keyData.type === 'white') {
                keyElement.classList.add('white-key', 'hover:bg-gray-100', 'z-0');
                if (whiteKeyCount > 0) keyElement.style.marginLeft = '-1px';
                whiteKeyCount++;
                // Append white key immediately
                keyboardContainer.appendChild(keyElement); 
            } else { // Black key logic
                keyElement.classList.add('black-key', 'hover:bg-gray-800');
                
                let position;
                const whiteKeyWidth = 60; 
                const blackKeyWidth = 36;
                
                // Positioning calculation
                const associatedWhiteNote = keyData.note.replace('#', '');
                let precedingWhiteKeyIndex = whiteKeyNotes.indexOf(associatedWhiteNote);

                if (precedingWhiteKeyIndex >= 0) {
                    position = (precedingWhiteKeyIndex + 1) * whiteKeyWidth - (blackKeyWidth / 2);
                } else { 
                    position = 0; 
                    console.error(`Could not position black key for note: ${keyData.note}`);
                }
                
                keyElement.style.left = `${position}px`;
                keyElement.style.top = '0';

                // Store black key for later appending (to maintain Z-index order)
                blackKeysToAppend.push(keyElement);
            }
        });

        // Append all stored black keys to ensure they are visually on top.
        blackKeysToAppend.forEach(keyEl => keyboardContainer.appendChild(keyEl));

        // --- NEW FUNCTION: Updates the note name shown on all keys ---
        function updateKeyLabels() {
            // Get all keys (both white and black) that have a note attribute
            const allKeys = document.querySelectorAll('#keyboard-container > div[data-original-note]');
            
            allKeys.forEach(keyEl => {
                const originalNote = keyEl.getAttribute('data-original-note');
                // Only update if the element actually has a note label to prevent errors
                const noteNameSpan = keyEl.querySelector('.note-name');
                
                if (originalNote && noteNameSpan) {
                    const shiftedNote = applyOctaveShift(originalNote, octaveShift);
                    noteNameSpan.textContent = shiftedNote;
                }
            });
        }
        // --- END NEW FUNCTION ---


        function playNote(originalNote) {
            if (Tone.context.state !== 'running') return;
            
            // 1. If physical key is already active, ignore the press
            if (activePhysicalKeys.has(originalNote)) return;

            // 2. Calculate the actual note to be played
            const shiftedNote = applyOctaveShift(originalNote, octaveShift);
            
            // 3. Update Visuals (based on original key)
            const keyEl = document.getElementById(`key-${originalNote.replace('#', 's')}`);
            if (keyEl) keyEl.classList.add('active');
            
            // 4. Update internal state maps/sets
            activePhysicalKeys.set(originalNote, shiftedNote);
            notesCurrentlySounding.add(shiftedNote); 

            // 5. Trigger Audio
            if (currentInstrument === 'piano') {
                if (arePianoSamplesLoaded) pianoSynth.triggerAttack(shiftedNote);
            } else {
                samplerSynth.triggerAttack(shiftedNote);
            }
            updateChordDisplay(); 
        }

        function stopNote(originalNote) {
            // 1. Check if the physical key was active
            if (!activePhysicalKeys.has(originalNote)) return;

            // 2. Retrieve the note that was ACTUALLY sounding for this key
            const soundingNote = activePhysicalKeys.get(originalNote);

            // 3. Update Visuals (based on original key)
            const keyEl = document.getElementById(`key-${originalNote.replace('#', 's')}`);
            if (keyEl) keyEl.classList.remove('active');
            
            // 4. Update internal state maps/sets
            activePhysicalKeys.delete(originalNote);
            notesCurrentlySounding.delete(soundingNote); 

            // 5. Trigger Audio Release
            if (currentInstrument === 'piano') {
                if (arePianoSamplesLoaded) pianoSynth.triggerRelease(soundingNote);
            } else {
                samplerSynth.triggerRelease(soundingNote);
            }
            updateChordDisplay(); 
        }


        document.addEventListener('keydown', (e) => {
            if (e.repeat || e.key === 'Tab') return; 
            const key = e.key.toLowerCase();
            if (keysMap[key]) playNote(keysMap[key].note);
        });

        document.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (keysMap[key]) stopNote(keysMap[key].note);
        });

        document.getElementById('start-audio').addEventListener('click', initAudio);
        
        // --- Initialize Octave Controls and Labels ---
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('octave-down').addEventListener('click', () => shiftOctave(-1));
            document.getElementById('octave-up').addEventListener('click', () => shiftOctave(1));
            updateOctaveDisplay(); // Set initial display to '0'
            updateKeyLabels(); // <--- Initial draw of the correct note labels
        });

    </script>
</body>
</html>
